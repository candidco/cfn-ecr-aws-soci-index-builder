name: CI

on:
  push:
    branches:
      - main
      - bug/sc-98670/soci-index-build-error
  pull_request:
    branches: [ main ]
    paths:
      - 'functions/source/soci-index-generator-lambda/**'
      - '.github/workflows/ci.yml'

env:
  GO_VERSION: '1.24'
  GOLANGCI_LINT_VERSION: '2.1.6'

jobs:
  lint:
    strategy:
      matrix:
        working_dir: ['functions/source/soci-index-generator-lambda']
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.working_dir }}

  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Download dependencies
        working-directory: ./functions/source/soci-index-generator-lambda
        run: go mod download
      - name: Run unit tests
        working-directory: ./functions/source/soci-index-generator-lambda
        run: make test

  deploy:
    name: Deploy SOCI Index Builder
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Install taskcat
        run: |
          yq --version
          pip install taskcat
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Deploy cloudformation stack using taskcat
        run: |
          # Uncomment to run deploy (uses .taskcat.yml from this repo)
          # taskcat test run -n
