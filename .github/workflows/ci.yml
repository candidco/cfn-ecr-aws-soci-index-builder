name: CI

on:
  push:
  pull_request:
    branches: [main]
    paths:
      - "functions/source/soci-index-generator-lambda/**"
      - ".github/workflows/ci.yml"

env:
  GO_VERSION: "1.24"
  GOLANGCI_LINT_VERSION: "2.1.6"

jobs:
  lint:
    strategy:
      matrix:
        working_dir: ["functions/source/soci-index-generator-lambda"]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.working_dir }}

  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: functions/source/soci-index-generator-lambda/go.sum

      - name: Download dependencies
        working-directory: ./functions/source/soci-index-generator-lambda
        run: go mod download

      - name: Run unit tests
        working-directory: ./functions/source/soci-index-generator-lambda
        run: make test

  deploy:
    name: Deploy SOCI Index Builder
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install taskcat
        run: |
          yq --version
          pip install taskcat

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fix Regions List
        run: |
          # Restrict the installation to us-east-1
          yq eval '.tests.can-deploy.regions = ["us-east-1"]' .taskcat.yml -i
          cat .taskcat.yml

      - name: Deploy cloudformation stack using taskcat
        run: |
          set +e
          taskcat test run -n
          exitcode=$?
          if [ $exitcode -ne 0 ]; then
            echo ""
            echo "::error::Deploy failed. The most probable cause is that a CloudFormation stack (or resources with fixed names, e.g. the EventBridge rule) already exists from a previous run. Taskcat does not update existing stacks."
            echo "→ Delete the existing taskcat-created stack in the target region(s) (e.g. us-east-1), then re-run this workflow."
            exit $exitcode
          fi
